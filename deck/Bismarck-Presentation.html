<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>City Intelligence</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   CITY INTELLIGENCE — an interactive account deck
   ---------------------------------------------------------------------------
   No corporate brand. Palette is the validated data-viz reference instance
   (dark mode), so every chart is colourblind-safe by construction:
     categorical  1 blue #3987e5 · 2 orange #d95926 · 3 aqua #199e70
                  4 yellow #c98500 · 5 magenta #d55181
     sequential   one blue hue, light -> dark (magnitude only)
     severity     one red hue, ordinal: #A82E1C -> #CC6044 -> #E3A188, always labelled
   Rules held throughout: one axis ever (never dual-axis), colour follows the
   entity not its rank, legend for >=2 series, hairline recessive grid,
   2px surface gaps between fills, hover layer on every chart, table view
   available on every chart.
   =========================================================================== */

:root{
  /* Accela 2026 brand */
  --blue:#0068BE; --bright:#00AFF1; --navy:#0D263A;
  --teal:#00CEC3; --yellow:#EAC645; --orange:#EA7445;

  /* Surfaces. LIGHT on purpose: the Accela palette is built for white, and on a
     dark surface every brand hue fails the viz lightness band (measured, not guessed). */
  --plane:#DCE5EC;    /* page behind the stage */
  --surf:#FFFFFF;     /* scene + chart surface — the surface the palette was validated against */
  --surf-2:#F6F9FB;   /* panel */
  --surf-3:#ECF2F6;   /* hover / input */
  --dark:#0D263A;     /* navy scenes: cover, dividers, chrome */

  /* Ink */
  --ink:#0D263A; --ink-2:#46606F; --ink-3:#7A8F9C;
  --grid:#E8EDF1; --axis:#C6D4DD; --hair:rgba(13,38,58,.12);

  /* Categorical series. Validated on #FFFFFF: lightness band, chroma floor,
     CVD separation, normal-vision floor all PASS. Fixed order, never cycled.
     Slot 2 (#EA7445) sits at 2.97:1 so it ships with visible labels + table view. */
  --s1:#0068BE; --s2:#EA7445; --s3:#00968C; --s4:#B8860B; --s5:#5B4BC4;

  /* Sequential, one hue, ordinal-safe on light (light end 2.32:1) */
  --q1:#003A66; --q2:#005694; --q3:#0068BE; --q4:#2A80CB; --q5:#5197D8; --q6:#7AAFE0;

  /* Status — reserved, never a series colour */
  /* Status / severity. Deliberately distinct from every series slot so a status
     colour can never impersonate a series, and always shipped with a label. */
  --good:#0F7A3D; --crit:#A82E1C; --p1:#A82E1C; --p2:#CC6044; --p3:#E3A188;

  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Aptos','Segoe UI',sans-serif;

  --W:1440px; --H:810px; --mx:76px; --my:56px; --gut:28px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --r:12px;
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--plane);font-family:var(--font);color:var(--ink);
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
#viewport{position:fixed;inset:0;display:grid;place-items:center}
#stage{width:var(--W);height:var(--H);position:relative;transform-origin:center;
  background:var(--surf);overflow:hidden;border-radius:6px;
  box-shadow:0 30px 90px rgba(13,38,58,.22),0 0 0 1px var(--hair)}

/* --- scene --------------------------------------------------------------- */
.sc{position:absolute;inset:0;overflow:hidden;padding:var(--my) var(--mx);display:flex;flex-direction:column;
  opacity:0;visibility:hidden;pointer-events:none;transform:translateY(10px);
  transition:opacity .34s var(--ease),transform .34s var(--ease),visibility 0s .34s}
.sc.on{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition:opacity .34s var(--ease),transform .34s var(--ease),visibility 0s}
/* navy scenes: no charts live here, so inverting the ink tokens is safe */
.sc.nav{background:var(--dark);color:#fff;
  background-image:radial-gradient(900px 560px at 84% -14%,rgba(0,175,241,.20),transparent 62%)}
.sc.nav h1,.sc.nav h2,.sc.nav b,.sc.nav strong{color:#fff}
.sc.nav .kick{color:var(--bright)}
.sc.nav p,.sc.nav .lede,.sc.nav .sm{color:#B9CBD6}
.sc.nav .foot{border-top-color:rgba(255,255,255,.16);color:#8FA8B8}
.sc.nav .foot b{color:var(--bright)}

/* --- type: 3 sizes + 2 weights per scene --------------------------------- */
.kick{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 14px;display:flex;align-items:center;gap:9px}
.kick::before{content:"";width:16px;height:1px;background:currentColor}
h1{font-size:40px;font-weight:600;letter-spacing:-.025em;line-height:1.1;margin:0;max-width:26ch}
.big{font-size:78px;font-weight:300;letter-spacing:-.035em;line-height:1;margin:0}
h2{font-size:19px;font-weight:600;letter-spacing:-.01em;margin:0 0 6px}
p{font-size:16px;line-height:1.55;color:var(--ink-2);margin:0 0 12px;max-width:66ch}
.lede{font-size:20px;line-height:1.5;color:var(--ink-2);max-width:56ch}
.sm{font-size:13.5px;line-height:1.5;color:var(--ink-3)}
.xs{font-size:11.5px;color:var(--ink-3)}
b,strong{font-weight:600;color:var(--ink)}
.num{font-variant-numeric:tabular-nums}

.head{flex:none;margin-bottom:22px}
.body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center}
.foot{flex:none;margin-top:18px;padding-top:14px;border-top:1px solid var(--grid);
  display:flex;gap:10px;align-items:baseline;font-size:11.5px;color:var(--ink-3)}
.foot b{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

.grid{display:grid;gap:var(--gut)}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}
.split{grid-template-columns:1.25fr .75fr}

/* --- panels -------------------------------------------------------------- */
.panel{background:var(--surf-2);border:1px solid var(--hair);border-radius:var(--r);padding:20px}
.panel.flat{background:transparent;border-color:var(--grid)}

/* --- stat tile ----------------------------------------------------------- */
.tile{display:flex;flex-direction:column;gap:3px}
.tile .v{font-size:44px;font-weight:300;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .l{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.tile .d{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:5px}
.tile .d i{font-style:normal;font-weight:600}
.tile .d i.up{color:var(--ink-2)} .tile .d i.dn{color:var(--crit)}

/* --- chart chrome -------------------------------------------------------- */
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.gridline{stroke:var(--grid);stroke-width:1}
.axisline{stroke:var(--axis);stroke-width:1}
.tick{font-size:10.5px;fill:var(--ink-3);font-family:var(--font);font-variant-numeric:tabular-nums}
.alabel{font-size:10px;fill:var(--ink-3);font-family:var(--font);letter-spacing:.1em;text-transform:uppercase}
.dlabel{font-size:11.5px;font-weight:600;font-family:var(--font)}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.mk{stroke:var(--surf);stroke-width:2}

.ctitle{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;gap:12px}
.ctitle h2{margin:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:12px}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);cursor:pointer;
  padding:3px 7px;border-radius:6px;transition:.12s;user-select:none}
.lg:hover{background:var(--surf-3)}
.lg i{width:10px;height:10px;border-radius:2px;display:block;flex:none}

/* table view — the accessibility fallback for every chart */
.tv{font-size:12px;border-collapse:collapse;width:100%;margin-top:12px;display:none}
.tv.on{display:table}
.tv th,.tv td{text-align:right;padding:5px 9px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums}
.tv th:first-child,.tv td:first-child{text-align:left;font-variant-numeric:normal}
.tv th{color:var(--ink-3);font-weight:500;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em}
.tv td{color:var(--ink-2)}
.tvb{align-self:flex-start;background:none;border:1px solid var(--grid);color:var(--ink-3);font-family:var(--font);
  font-size:10.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
  padding:4px 9px;border-radius:5px;cursor:pointer;transition:.12s}
.tvb:hover{border-color:var(--ink-3);color:var(--ink-2)}

/* --- tooltip ------------------------------------------------------------- */
#tip{position:fixed;z-index:90;pointer-events:none;opacity:0;transition:opacity .1s;
  background:var(--dark);color:#fff;border-radius:9px;padding:9px 12px;
  font-size:12.5px;line-height:1.45;box-shadow:0 14px 44px rgba(13,38,58,.4);max-width:290px}
#tip.on{opacity:1}
#tip .tt{font-weight:600;margin-bottom:5px;font-size:12px}
#tip .tr{display:flex;justify-content:space-between;gap:16px;color:#B9CBD6}
#tip .tr i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:6px}
#tip .tr b{font-variant-numeric:tabular-nums}

/* --- year scrubber (the spine of every time-aware scene) ----------------- */
.scrub{display:flex;align-items:center;gap:18px;margin-top:20px;flex:none;padding-right:9px}
.scrub .yr{font-size:34px;font-weight:300;letter-spacing:-.02em;font-variant-numeric:tabular-nums;
  min-width:96px;line-height:1}
.play{width:36px;height:36px;flex:none;border-radius:50%;border:1px solid var(--hair);
  background:var(--surf-3);color:var(--ink);cursor:pointer;display:grid;place-items:center;transition:.14s}
.play:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.play svg{width:12px;height:12px;fill:currentColor}
.rail{flex:1;position:relative;height:34px;display:flex;align-items:center;cursor:pointer}
.rail .bg{position:absolute;left:0;right:0;height:2px;background:var(--grid)}
.rail .fg{position:absolute;left:0;height:2px;background:var(--s1);transition:width .18s var(--ease)}
.rail .stops{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center}
.rail .st{width:9px;height:9px;border-radius:50%;background:var(--surf);border:1.5px solid var(--axis);
  transition:.14s;position:relative}
.rail .st.past{border-color:var(--s1);background:var(--s1)}
.rail .st.now{width:15px;height:15px;background:var(--blue);border-color:var(--blue);
  box-shadow:0 0 0 5px rgba(0,104,190,.16)}
.rail .st span{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:10px;
  color:var(--ink-3);font-variant-numeric:tabular-nums;opacity:0;transition:.14s}
.rail .st.now span,.rail:hover .st span{opacity:1}

/* --- logo ---------------------------------------------------------------- */
.logo{display:block;height:26px;width:auto}
.logo.inv{filter:brightness(0) invert(1)}
.mark{display:block;flex:none}

/* --- icon slot ------------------------------------------------------------ */
.ico{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;
  stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icobox{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none;
  background:rgba(0,104,190,.09);color:var(--blue)}
.sc.nav .icobox{background:rgba(0,175,241,.14);color:var(--bright)}

/* --- image slot ----------------------------------------------------------- */
.fig{position:relative;border-radius:var(--r);overflow:hidden;background:var(--surf-2);
  border:1px solid var(--hair)}
.fig img{display:block;width:100%;height:100%;object-fit:cover}
.fig figcaption{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;font-size:11.5px;
  color:#fff;background:linear-gradient(to top,rgba(13,38,58,.86),transparent)}
.fig.empty{border:1px dashed var(--axis);background:var(--surf-2);display:grid;place-items:center;
  text-align:center;padding:16px}
.fig.empty .eh{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.fig.empty .ed{font-size:12px;color:var(--ink-3);margin-top:5px;line-height:1.4;max-width:24ch}
.fig.empty .es{font-size:10.5px;color:var(--axis);margin-top:7px;font-variant-numeric:tabular-nums}
.sc.nav .fig.empty{border-color:rgba(255,255,255,.28);background:rgba(255,255,255,.04)}
.sc.nav .fig.empty .eh,.sc.nav .fig.empty .ed{color:#8FA8B8}

/* --- clickable affordance ------------------------------------------------ */
.clk{cursor:pointer;transition:.14s}
.clk:focus-visible{outline:2.5px solid var(--blue);outline-offset:3px;border-radius:4px}
.clk:hover{filter:brightness(1.18)}
.hint{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:500;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  border:1px dashed var(--axis);border-radius:999px;padding:3px 10px}
.hint::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--blue);
  animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* --- org chart ----------------------------------------------------------- */
.org{display:flex;flex-direction:column;align-items:center;gap:0}
.node{background:var(--surf-2);border:1px solid var(--hair);border-radius:10px;
  padding:11px 16px;cursor:pointer;transition:.15s;text-align:center;min-width:150px;position:relative}
.node:hover{border-color:var(--ink-3);background:var(--surf-3);transform:translateY(-1px)}
.node.sel{border-color:var(--blue);background:rgba(0,104,190,.08);box-shadow:0 0 0 3px rgba(0,104,190,.10)}
.node .nm{font-size:13.5px;font-weight:600;line-height:1.25}
.node .rl{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.node .ft{font-size:10.5px;color:var(--ink-3);margin-top:5px;font-variant-numeric:tabular-nums}
.node .bar{position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:0 0 8px 8px}
.orgrow{display:flex;gap:14px;justify-content:center;align-items:stretch}
.stem{width:1px;background:var(--axis);height:22px;margin:0 auto}
.conn{display:flex;width:100%;height:24px}
.conn>div{flex:1;position:relative}
.conn>div::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--axis)}
.conn>div::after{content:"";position:absolute;top:0;height:1px;background:var(--axis);left:50%;right:-50%}
.conn>div:last-child::after{display:none}

/* --- heatmap ------------------------------------------------------------- */
.hm{display:grid;gap:2px}
.hm .cell{aspect-ratio:2.6/1;border-radius:3px;cursor:pointer;transition:.13s;position:relative;
  display:grid;place-items:center;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.hm .cell:hover{outline:2px solid var(--ink);outline-offset:1px}
.hm .rh{font-size:12px;color:var(--ink-2);display:flex;align-items:center;justify-content:flex-end;
  padding-right:10px;text-align:right;line-height:1.2}
.hm .ch{font-size:10.5px;color:var(--ink-3);text-align:center;line-height:1.25;padding-bottom:6px;
  align-self:end}
.scale{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-3);margin-top:12px}
.scale .sw{display:flex;gap:2px}
.scale .sw i{width:22px;height:9px;border-radius:2px;display:block}

/* --- map ----------------------------------------------------------------- */
.mapwrap{position:relative}
.dist{stroke:var(--surf);stroke-width:2.5;cursor:pointer;transition:opacity .2s,fill .4s var(--ease)}
.dist:hover{opacity:.82}
.dist.future{fill:var(--surf-2);stroke-dasharray:3 3;stroke:var(--axis)}
.mlabel{font-size:10.5px;fill:var(--ink-2);font-family:var(--font);pointer-events:none;font-weight:500}

/* --- journey ------------------------------------------------------------- */
.jstep{cursor:pointer}
.jstep rect.hit{fill:transparent}
.jstep:hover .jbox{stroke:var(--ink-3)}
.jbox{fill:var(--surf);stroke:var(--axis);stroke-width:1.5;transition:.14s}
.jstep.sel .jbox{stroke:var(--blue);fill:rgba(0,104,190,.12)}

/* --- growth race ---------------------------------------------------------
   One measure (% growth since the base year) across five entities, on ONE
   shared zero-based axis. Independently-scaled sparklines made a 16% rise draw
   the same shape as an 86% rise; a shared axis is the entire point of the scene. */
.race{display:grid;grid-template-columns:190px 1fr 170px;gap:4px 22px;align-items:center}
.race .rl{font-size:14.5px;font-weight:500;color:var(--ink-2);text-align:right;line-height:1.2}
.race .rl.hi{color:var(--ink);font-weight:700}
.race .rt{position:relative;height:46px}
.race .rg{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.race .rg.zero{background:var(--axis)}
.race .rax{position:relative;height:18px}
.race .rgl{position:absolute;top:0;transform:translateX(-50%);font-size:10.5px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.race .rgl.z{transform:none;left:0}
.race .rb{position:absolute;left:0;top:8px;height:30px;border-radius:0 5px 5px 0;background:var(--s1);
  transition:width .42s var(--ease);min-width:2px}
.race .rb.hi{background:var(--s2)}
.race .rv{display:flex;flex-direction:column;gap:1px;line-height:1.15}
.race .rv b{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;
  transition:color .3s}
.race .rv span{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.race .rrow{display:contents;cursor:default}
.raceflag{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--s2);
  background:rgba(234,116,69,.10);border-radius:999px;padding:6px 14px;transition:opacity .3s}
.raceflag.base{color:var(--ink-3);background:var(--surf-3)}
.racecap{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}

/* --- segmented control ---------------------------------------------------- */
.seg{display:inline-flex;background:var(--surf-3);border:1px solid var(--hair);
  border-radius:999px;padding:3px;flex:none}
.segb{font-family:var(--font);font-size:12px;font-weight:600;letter-spacing:.02em;
  padding:6px 15px;border:0;border-radius:999px;background:none;color:var(--ink-2);cursor:pointer;transition:.14s}
.segb:hover{color:var(--ink)}
.segb.on{background:var(--blue);color:#fff}
.segb:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}

/* --- journey bar ---------------------------------------------------------- */
.jin{font-size:12px;font-weight:600;font-family:var(--font);font-variant-numeric:tabular-nums}
.jlb{font-size:12.5px;font-weight:500;font-family:var(--font);fill:var(--ink)}
.jrow{font-size:14px;font-weight:700;font-family:var(--font);fill:var(--ink)}
.jseg .jr{transition:.14s}
.jseg:hover .jr{filter:brightness(1.08)}
.jseg:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
.delta{font-size:13px;font-weight:700;color:var(--blue);background:rgba(0,104,190,.08);
  border-radius:999px;padding:5px 14px}

/* --- drill-down drawer --------------------------------------------------- */
/* Centred modal, not a side panel. This is presented from the front of a room,
   so a drill-down belongs in the middle of the screen, not off to one edge. */
#drawer{position:absolute;top:50%;left:50%;width:min(900px,80%);max-height:78%;
  background:var(--surf);border:1px solid var(--hair);border-radius:18px;z-index:50;
  transform:translate(-50%,-47%) scale(.975);opacity:0;visibility:hidden;
  transition:transform .3s var(--ease),opacity .26s var(--ease),visibility .3s;
  overflow-y:auto;padding:44px 52px 48px;
  box-shadow:0 44px 110px rgba(13,38,58,.34)}
#drawer.open{transform:translate(-50%,-50%) scale(1);opacity:1;visibility:visible}
#drawer .x{position:absolute;top:22px;right:24px;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--hair);background:none;color:var(--ink-2);cursor:pointer;font-size:17px;line-height:1}
#drawer .x:hover{background:var(--surf-3);color:var(--ink)}
#drawer .dk{font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
#drawer h3{font-size:34px;font-weight:300;letter-spacing:-.03em;margin:0 0 6px;line-height:1.1}
#drawer .sub{font-size:15px;color:var(--ink-3);margin-bottom:28px}
#drawer .kv{display:flex;justify-content:space-between;gap:18px;padding:13px 0;border-bottom:1px solid var(--grid);font-size:15.5px;flex-wrap:wrap}
#drawer .kv b{max-width:62%}
#drawer .kv span{color:var(--ink-3)}
#drawer .kv b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
#drawer .need{border-left:2px solid var(--axis);padding:2px 0 2px 13px;margin:14px 0}
#drawer .need.p1{border-left-color:var(--p1)}
#drawer .need.p2{border-left-color:var(--p2)}
#drawer .need.p3{border-left-color:var(--p3)}
#drawer .need .nt{font-size:14px;font-weight:600;margin-bottom:3px}
#drawer .need .pr{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);display:block;margin-bottom:3px}
#drawer .need .nd{font-size:12.5px;color:var(--ink-2);line-height:1.5}
#drawer .sechd{font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--s1);margin:30px 0 12px;padding-top:22px;border-top:1px solid var(--grid)}

.chreq.dense .r{padding:8px 20px !important}
.chreq.dense{gap:6px}
.chreq.dense .r .qt{font-size:17.5px}
.chreq.dense .r .qo{line-height:1.35}
.chreq.dense + .chfoot{margin-top:8px}
.chreq.dense + .chfoot .nextch{padding:6px 14px;font-size:14px}

<style>
/* priorities as real rows: one border per row, every cell centred */
.prt{display:flex;flex-direction:column}
.prr{display:grid;grid-template-columns:52px 1fr 1.25fr .95fr;gap:0 26px;align-items:center;padding:17px 0;border-bottom:1px solid var(--grid)}
.prr.hd{padding:0 0 10px;border-bottom:1px solid var(--axis);font-size:16px;font-weight:600;color:var(--ink-2)}
.prr .pic{color:var(--s1)} .prr .pic svg{width:30px;height:30px;display:block}
.prr .ask{font-size:22px;font-weight:500;letter-spacing:-.012em}
.prr .why{font-size:17.5px;color:var(--ink-2);line-height:1.45}
.prr .out{font-size:17px;font-weight:600;color:var(--s3)}
.also2{margin-top:26px}
.also2 .lb2{font-size:16px;font-weight:600;color:var(--ink-2);margin-bottom:12px}
.alg{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.alc{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid var(--hair);border-radius:14px;padding:16px 18px}
.alc .pic{color:var(--s1);flex:none} .alc .pic svg{width:24px;height:24px;display:block}
.alc .at{font-size:16.5px;font-weight:500;line-height:1.3}
.alc .ao{font-size:15px;font-weight:600;color:var(--s3);margin-top:6px}
/* closing */
.clg{display:flex;flex-direction:column;gap:14px;max-width:1100px}
.clr{display:grid;grid-template-columns:50px 44px 1fr auto;gap:20px;align-items:center;background:#fff;border:1px solid var(--hair);border-radius:16px;padding:22px 26px;box-shadow:0 8px 24px rgba(13,38,58,.05)}
.clr .cn3{font-size:15px;font-weight:700;color:var(--s1)}
.clr .pic{color:var(--s1)} .clr .pic svg{width:28px;height:28px;display:block}
.clr .ct{font-size:25px;font-weight:300;letter-spacing:-.015em}
.clr .cw{font-size:15px;font-weight:600;color:var(--s1);background:rgba(0,104,190,.07);border-radius:999px;padding:7px 15px}
.clc{display:flex;gap:40px;margin-top:34px;font-size:17px;color:var(--ink-2)}
.clc b{color:var(--ink);font-weight:600;margin-right:8px}
/* the AI CLI prototype tag */
.term .bar2{align-items:center}
.term .bar2 .proto{margin-left:auto;font-family:var(--font);font-size:13px;font-weight:700;letter-spacing:.06em;color:#0B1D2C;background:#EAC645;border-radius:999px;padding:4px 12px}
/* optical centring on my scenes: content sits slightly above centre */
.sc.t-team .body,.sc.t-company .body,.sc.t-peers .body,.sc.t-mandates .body,.sc.t-ai .body,.sc.t-agents .body,.sc.t-aicli .body,.sc.t-priorities .body,.sc.t-closing .body{padding-bottom:56px}
/* backstage: inputs never push past the status dot */
.lk .row input{box-sizing:border-box}
.lk .row{grid-template-columns:42px 190px minmax(0,1fr) 16px}
/* H hides the controls, never the logos */
#chrome.hide{transform:none !important;opacity:1 !important;visibility:visible !important}
#chrome.hide button,#chrome.hide #cnt{visibility:hidden}
</style>
<style>
/* ===== GIS LAYER (own ArcGIS Online): cover, closing, five new scenes ===== */
.covmap{position:absolute;right:-70px;top:50%;width:880px;height:880px;transform:translateY(-50%);z-index:0;pointer-events:none}
.covmap img,.covmap svg{position:absolute;inset:0;width:100%;height:100%}
.sc .covmap .ml{opacity:0;clip-path:inset(0 100% 0 0)}
.sc.on .covmap .ml{animation:mapin .9s var(--ease) forwards}
@keyframes mapin{to{opacity:var(--o,.6);clip-path:inset(0 0 0 0)}}
.sc .covmap .lim{stroke-dasharray:6000;stroke-dashoffset:6000}
.sc.on .covmap .lim{animation:limdraw 2.2s var(--ease) forwards .1s}
@keyframes limdraw{to{stroke-dashoffset:0}}
.cov2{position:relative;z-index:1;max-width:620px}
.cov2 .city{height:96px;width:auto;display:block}
.cov2 .lede2{font-size:28px;font-weight:300;color:#DCE9F2;margin-top:26px}
.cov2 .brands{display:flex;align-items:center;gap:22px;margin-top:34px}
.cov2 .brands img{height:22px;width:auto}
.cov2 .brands i{width:1px;height:22px;background:rgba(255,255,255,.25)}
.cov2 .cstats{display:flex;gap:44px;margin-top:54px}
.cov2 .cstats .v{font-size:40px;font-weight:300;letter-spacing:-.03em;line-height:1;color:#fff}
.cov2 .cstats .l{font-size:15px;color:rgba(220,233,242,.78);margin-top:8px}
.sc.t-cover::before{display:none}
.sc.t-closing{background:var(--dark);color:#fff}
.sc.t-closing::before{display:none}
.sc.t-closing h1{color:#fff}
.closemap{position:absolute;right:-120px;top:50%;width:860px;height:860px;transform:translateY(-50%);z-index:0;pointer-events:none;opacity:.26}
.sc.on .closemap{animation:breathe 7s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.24}50%{opacity:.38}}
.sc.t-closing .clr{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12);box-shadow:none}
.sc.t-closing .clr .ct{color:#fff} .sc.t-closing .clr .pic,.sc.t-closing .clr .cn3{color:#7FC4F7}
.sc.t-closing .clr .cw{color:#fff;background:var(--s1)}
.sc.t-closing .clc{color:#B9CBD6} .sc.t-closing .clc b{color:#fff}
.sc.t-closing .clg{max-width:900px}
@media (prefers-reduced-motion: reduce){.sc.on .covmap .ml,.sc.on .covmap .lim,.sc.on .closemap{animation:none;opacity:var(--o,.6);clip-path:none;stroke-dashoffset:0}}
body.nomotion *{animation-duration:.01s !important;animation-delay:0s !important}
.co3 .cc:nth-child(2){border-top-color:var(--s1) !important}
.co3 .cc:nth-child(2) .bn{color:var(--s1) !important}
.esg{display:grid;grid-template-columns:1fr 1.15fr;gap:56px;align-items:center}
.esa .aw2{font-size:16px;font-weight:700;letter-spacing:.02em;color:var(--s1)}
.esa .big2{font-size:46px;font-weight:600;letter-spacing:-.03em;line-height:1.08;color:var(--ink);margin-top:12px}

.esa svg.lim2{display:block;height:170px;width:auto;margin-top:26px}
.esa svg.lim2 path{stroke:var(--s1);stroke-width:5;fill:rgba(0,104,190,.06);stroke-dasharray:6000;stroke-dashoffset:6000}
.sc.on .esa svg.lim2 path{animation:limdraw 2.4s var(--ease) forwards .2s}
.hubwrap svg{display:block;width:100%;height:auto}
.hubwrap .sp{stroke-dasharray:400;stroke-dashoffset:400}
.sc.on .hubwrap .sp{animation:spd 1s var(--ease) forwards}
@keyframes spd{to{stroke-dashoffset:0}}
.esband{margin-top:30px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-top:24px;border-top:1px solid var(--grid)}
.esband .nt{font-size:17px;font-weight:600;color:var(--ink-2);margin-right:4px}
.esband .tl{display:flex;align-items:center;gap:12px;padding:10px 18px;border-radius:999px;background:#fff;border:1px solid var(--hair);font-size:16px}
.esband .tl img{height:26px;width:auto}
.esband .tl b{font-weight:600}
.esline{margin-top:20px;font-size:24px;font-weight:300;color:var(--ink)}
.wf{display:grid;grid-template-columns:auto minmax(0,1fr);gap:40px;align-items:center}
.wf svg{display:block;height:auto}
.wf rect.c{transition:opacity .6s var(--ease)}
.wf.s2 rect.c.wfix,.wf.s2 rect.c.wveh{opacity:.16 !important}
.wff .fg2{font-size:84px;font-weight:200;letter-spacing:-.045em;color:var(--s1);line-height:.95}

.wlg{margin-top:28px;display:flex;flex-direction:column;gap:14px}
.wlg .g{display:grid;grid-template-columns:16px 1fr auto;gap:12px;align-items:start}

.wlg .gd{font-size:15px;color:var(--ink-2);line-height:1.45;margin-top:2px}
.wlg .gn{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.q4g{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}

.q4c .n{font-size:52px;font-weight:200;color:var(--s1);line-height:1}
.q4c .nd{font-size:22px;font-weight:600;margin-top:18px;line-height:1.25;letter-spacing:-.01em}
.q4c .an{font-size:17.5px;color:var(--ink-2);margin-top:12px;line-height:1.4}
.q4c.test .an{color:var(--s1);font-weight:600}
.q4flow{margin-top:30px}
.q4flow svg{display:block;width:640px;max-width:100%;height:auto;margin:0 auto}

.sc.on .q4flow .dash{animation:dashflow 1.2s linear infinite}
@keyframes dashflow{to{stroke-dashoffset:-32}}
.q4src{font-size:20px;color:var(--ink-3);margin-bottom:26px}
.mlg{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.mlc{border-radius:16px;border:1px solid var(--hair);background:#fff;overflow:hidden;position:relative;box-shadow:0 8px 24px rgba(13,38,58,.05)}
.mlc .hd2{padding:20px 26px;font-size:34px;font-weight:600;letter-spacing:-.02em}
.mlc.mv .hd2{background:var(--s1);color:#fff}
.mlc .rw{padding:0 26px}
.mlc .rw div{padding:13px 0;border-bottom:1px solid var(--grid);font-size:19px}
.mlc .rw div:last-child{border-bottom:0}
.mlc .ft2{padding:16px 26px 20px;font-size:16px;font-weight:600;color:var(--s1)}
.mlc svg.wm{position:absolute;right:-30px;bottom:-30px;height:200px;width:auto;opacity:.08}
.mlc svg.wm path{fill:var(--s1)}
.mltl{margin-top:28px}
.mltl svg{display:block;width:100%;height:auto}
.mlline{margin-top:10px;font-size:24px;font-weight:300;text-align:center}
.wo{display:flex;flex-direction:column;gap:6px;max-width:1180px}
.wor{display:grid;grid-template-columns:1fr 44px 1fr;gap:18px;align-items:center;padding:18px 0;border-bottom:1px solid var(--grid)}
.wor .ph2{font-size:40px;font-weight:300;letter-spacing:-.025em}
.wor .ph2 b{font-weight:700;color:var(--ink)}
.wor .ck svg{width:36px;height:36px;display:block}
.wor .ck .cp{stroke-dasharray:40;stroke-dashoffset:40}
.sc.on .wor .ck .cp{animation:spd .5s var(--ease) forwards .4s}
.wor .ans{font-size:22px;color:var(--ink)}
.wor.open .ans{color:var(--ink-3)}
.woline{margin-top:28px;font-size:30px;font-weight:300}
</style>

/* --- image slots ----------------------------------------------------------
   fig({src,alt,caption}, "16/9", "Cover image") renders the picture if there is
   one and a labelled, correctly-sized placeholder if there is not. An empty slot
   that tells you what to drop in beats a slot that silently collapses.      */
function fig(c,ratio="16/9",label="Image",px=""){
  const st=`aspect-ratio:${ratio}`;
  if(c&&c.src) return `<figure class="fig" style="${st};margin:0">
    <img src="${esc(c.src)}" alt="${esc(c.alt||"")}">
    ${c.caption?`<figcaption>${esc(c.caption)}</figcaption>`:""}</figure>`;
  return `<div class="fig empty" style="${st}"><div>
    <div class="eh">${esc(label)}</div>
    <div class="ed">${esc((c&&c.hint)||"Drop a file path or URL into this slot")}</div>
    ${px?`<div class="es">${esc(px)}</div>`:""}</div></div>`;
}

/* --- tooltip -------------------------------------------------------------- */
const TIP=$("#tip");
function tip(html,ev){
  TIP.innerHTML=html; TIP.classList.add("on");
  const r=TIP.getBoundingClientRect();
  let x=ev.clientX+16, y=ev.clientY-r.height/2;
  if(x+r.width>innerWidth-12) x=ev.clientX-r.width-16;
  TIP.style.left=Math.max(8,x)+"px";
  TIP.style.top=Math.min(innerHeight-r.height-8,Math.max(8,y))+"px";
}
const untip=()=>TIP.classList.remove("on");

/* --- table view (accessibility fallback, one per chart) ------------------- */
let TVN=0;
function tableView(head,rows){
  const id="tv"+(TVN++);
  return `<button class="tvb" data-tv="${id}">Table</button>
    <table class="tv" id="${id}"><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

/* --- small-multiple area (one measure, its own axis) ---------------------- */
/*  Four measures of different scale => four charts. Never one dual-axis plot. */
/* --- indexed multi-series line (one axis, always) ------------------------- */
function indexedLine(series,opts={}){
  const W=opts.W||860,H=opts.H||300,P={t:14,r:70,b:28,l:44};
  const ys=CITY.years,n=ys.length;
  const all=series.flatMap(s=>s.idx);
  const lo=Math.floor(Math.min(...all,100)/10)*10-5, hi=Math.ceil(Math.max(...all)/10)*10+5;
  const X=i=>P.l+(i/(n-1))*(W-P.l-P.r), Y=d=>P.t+(1-(d-lo)/(hi-lo))*(H-P.t-P.b);
  const ticks=[]; for(let t=Math.ceil(lo/25)*25;t<=hi;t+=25) ticks.push(t);
  let g="";
  ticks.forEach(t=>{ g+=`<line class="gridline" x1="${P.l}" y1="${Y(t)}" x2="${W-P.r}" y2="${Y(t)}"/>
    <text class="tick" x="${P.l-9}" y="${Y(t)+3.5}" text-anchor="end">${t}</text>`; });
  ys.forEach((y,i)=>{ if(i%2===0||i===n-1) g+=`<text class="tick" x="${X(i)}" y="${H-8}" text-anchor="middle">${String(y).slice(2)}</text>`; });
  g+=`<line class="axisline" x1="${P.l}" y1="${Y(100)}" x2="${W-P.r}" y2="${Y(100)}" stroke-dasharray="0"/>`;
  series.forEach(s=>{
    const d=s.idx.map((v,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
    g+=`<path d="${d}" class="ln" stroke="var(${s.c})"/>`;
    g+=`<circle class="mk" cx="${X(n-1)}" cy="${Y(s.idx[n-1])}" r="4.5" fill="var(${s.c})"/>`;
    g+=`<text class="dlabel" x="${W-P.r+10}" y="${Y(s.idx[n-1])+4}" fill="var(${s.c})">${s.idx[n-1]}</text>`;
  });
  g+=`<line class="xh" x1="0" y1="${P.t}" x2="0" y2="${H-P.b}" stroke="var(--ink-3)" stroke-width="1" opacity="0"/>`;
  g+=`<rect class="hit" x="${P.l}" y="${P.t}" width="${W-P.l-P.r}" height="${H-P.t-P.b}" fill="transparent"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="xline" data-p='${JSON.stringify({W,H,P,n})}'>${g}</svg>`;
}

/* --- the gap: two series, one axis, the space between them shaded ---------
   Scene 3 already says workload outgrew staffing. The only thing this chart can
   add is WHEN, so it is two lines and the area between them, not four lines. */
function gapChart(a,b,markIdx,markText){
  const W=880,H=330,P={t:20,r:78,b:34,l:46};
  const ys=CITY.years,n=ys.length, all=[...a.idx,...b.idx];
  /* A series may fall below its own baseline. Floor the axis to the data, not to 90,
     or a declining line is drawn outside the chart box. */
  const mn=Math.min(...all), mx=Math.max(...all);
  const lo=Math.min(90,Math.floor(mn/10)*10-10), hi=Math.ceil(mx/20)*20;
  const span=hi-lo, step=span<=60?10:span<=140?20:40;
  const X=i=>P.l+(i/(n-1))*(W-P.l-P.r), Y=d=>P.t+(1-(d-lo)/(hi-lo))*(H-P.t-P.b);
  let g="";
  for(let t=Math.ceil((lo+1)/step)*step;t<=hi;t+=step) g+=`<line class="gridline" x1="${P.l}" y1="${Y(t)}" x2="${W-P.r}" y2="${Y(t)}"/>
    <text class="tick" x="${P.l-9}" y="${Y(t)+3.5}" text-anchor="end">${t}</text>`;
  ys.forEach((y,i)=>{ if(i%2===0||i===n-1) g+=`<text class="tick" x="${X(i)}" y="${H-12}" text-anchor="middle">${y}</text>`; });
  const up=a.idx.map((v,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("");
  const dn=b.idx.map((v,i)=>`L${X(n-1-i).toFixed(1)},${Y(b.idx[n-1-i]).toFixed(1)}`).join("");
  g+=`<path d="${up}${dn}Z" fill="var(--s2)" fill-opacity=".13"/>`;
  if(markIdx!=null){
    g+=`<line x1="${X(markIdx)}" y1="${P.t}" x2="${X(markIdx)}" y2="${H-P.b}" stroke="var(--axis)" stroke-dasharray="4 4"/>
        <text class="alabel" x="${X(markIdx)+8}" y="${P.t+12}" style="fill:var(--ink-2);text-transform:none;letter-spacing:0;font-size:11.5px">${esc(markText)}</text>`;
  }
  [a,b].forEach(s=>{
    g+=`<path d="${s.idx.map((v,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("")}" class="ln" stroke="var(${s.c})"/>`;
    g+=`<circle class="mk" cx="${X(n-1)}" cy="${Y(s.idx[n-1])}" r="4.5" fill="var(${s.c})"/>`;
    g+=`<text class="dlabel" x="${W-P.r+10}" y="${Y(s.idx[n-1])+4}" fill="var(${s.c})">${s.idx[n-1]}</text>`;
  });
  const gy1=Y(a.idx[n-1]), gy2=Y(b.idx[n-1]), gx=W-P.r-14;
  g+=`<path d="M${gx},${gy1} L${gx-7},${gy1} M${gx},${gy2} L${gx-7},${gy2} M${gx},${gy1} L${gx},${gy2}"
        stroke="var(--s2)" stroke-width="1.5" fill="none"/>
      <text class="dlabel" x="${gx-11}" y="${(gy1+gy2)/2+4}" text-anchor="end" fill="var(--s2)">${Math.abs(a.idx[n-1]-b.idx[n-1])} pts</text>`;
  g+=`<line class="xh" x1="0" y1="${P.t}" x2="0" y2="${H-P.b}" stroke="var(--ink-3)" stroke-width="1" opacity="0"/>`;
  g+=`<rect class="hit" x="${P.l}" y="${P.t}" width="${W-P.l-P.r}" height="${H-P.t-P.b}" fill="transparent"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="xgap" data-p='${JSON.stringify({W,H,P,n})}'>${g}</svg>`;
}

/* --- stacked area, click a band to drill ---------------------------------- */
function stackArea(cats,opts={}){
  const W=opts.W||820,H=opts.H||290,P={t:14,r:16,b:28,l:52};
  const ys=CITY.years,n=ys.length;
  const tot=ys.map((_,i)=>cats.reduce((a,c)=>a+c.v[i],0));
  const hi=Math.ceil(Math.max(...tot)/500)*500;
  const X=i=>P.l+(i/(n-1))*(W-P.l-P.r), Y=d=>P.t+(1-d/hi)*(H-P.t-P.b);
  let g="";
  for(let t=0;t<=hi;t+=500) g+=`<line class="gridline" x1="${P.l}" y1="${Y(t)}" x2="${W-P.r}" y2="${Y(t)}"/>
    <text class="tick" x="${P.l-9}" y="${Y(t)+3.5}" text-anchor="end">${t.toLocaleString()}</text>`;
  ys.forEach((y,i)=>{ if(i%2===0||i===n-1) g+=`<text class="tick" x="${X(i)}" y="${H-8}" text-anchor="middle">${String(y).slice(2)}</text>`; });
  const base=new Array(n).fill(0);
  cats.forEach((c,ci)=>{
    const top=base.map((b,i)=>b+c.v[i]);
    const up=top.map((d,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(d).toFixed(1)}`).join("");
    const dn=base.map((d,i)=>`L${X(n-1-i).toFixed(1)},${Y(base[n-1-i]).toFixed(1)}`).join("");
    /* stroke in the surface colour IS the 2px gap between stacked fills */
    g+=`<path class="band clk" data-cat="${c.key}" d="${up}${dn}Z" fill="var(${SER[ci]})" fill-opacity=".78"
          stroke="var(--surf)" stroke-width="2" stroke-linejoin="round"/>`;
    for(let i=0;i<n;i++) base[i]=top[i];
  });
  g+=`<line class="xh" x1="0" y1="${P.t}" x2="0" y2="${H-P.b}" stroke="var(--ink)" stroke-width="1" opacity="0"/>`;
  g+=`<rect class="hit" x="${P.l}" y="${P.t}" width="${W-P.l-P.r}" height="${H-P.t-P.b}" fill="transparent"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="xstack" data-p='${JSON.stringify({W,H,P,n})}'>${g}</svg>`;
}

/* --- horizontal bars, one hue, selective emphasis ------------------------- */
function barsH(items,opts={}){
  const W=opts.W||760,rh=opts.rh||34,P={l:opts.l||178,r:70};
  const H=items.length*rh+8, hi=Math.max(...items.map(i=>i.v));
  let g="";
  items.forEach((it,i)=>{
    const y=i*rh+4, w=(it.v/hi)*(W-P.l-P.r), on=it.hi;
    g+=`<g class="clk" data-bar="${esc(it.key||it.l)}">
      <rect x="0" y="${y}" width="${W}" height="${rh-4}" fill="transparent"/>
      <text class="tick" x="${P.l-12}" y="${y+rh/2-1}" text-anchor="end"
            style="font-size:12.5px;fill:${on?"var(--ink)":"var(--ink-2)"};font-weight:${on?600:400}">${esc(it.l)}</text>
      <rect x="${P.l}" y="${y+4}" width="${Math.max(2,w)}" height="${rh-14}" rx="4"
            fill="var(--s1)" fill-opacity="${on?1:.42}"/>
      <text class="dlabel" x="${P.l+w+10}" y="${y+rh/2+2.5}"
            fill="${on?"var(--ink)":"var(--ink-3)"}">${it.d||it.v.toLocaleString()}</text></g>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="xbars">${g}</svg>`;
}

/* --- journey: elapsed time drawn to scale --------------------------------
   Position is proportional to DAYS, not to step index. The nine-day wait has to
   look nine times wider than the one-day intake or the chart argues against its
   own headline.                                                             */
const JW=1290, JPAD=8, JSCALE=()=>CITY.journey.now.total;
const KIND={ work:{c:"var(--s1)",  t:"City working"},
             wait:{c:"var(--s2)", t:"City waiting"},
             applicant:{c:"var(--axis)", t:"With the applicant"} };

function journeyBar(which,y,hgt,labels){
  const J=CITY.journey[which], px=(JW-JPAD*2)/JSCALE();
  let x=JPAD, g="", band=[[],[],[],[]];
  J.segs.forEach((sg,i)=>{
    const w=Math.max(4,sg.days*px-2), cx=x+w/2, k=KIND[sg.kind];
    const dark=sg.kind==="applicant";
    g+=`<g class="jseg clk" data-step="${which}:${i}" role="button" tabindex="0">
      <rect class="jr" x="${x.toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height="${hgt}" rx="4" fill="${k.c}"/>
      ${w>=34?`<text x="${cx.toFixed(1)}" y="${y+hgt/2+4.5}" text-anchor="middle" class="jin"
         style="fill:${dark?"var(--ink)":"#fff"}">${sg.days===0?"same day":sg.days+"d"}</text>`:""}
    </g>`;
    if(labels){
      const est=sg.l.length*6.1;
      /* First-fit across N rows. The old version only tested row 0 and dumped every
         further collision into row 1, so three narrow blocks stacked on one line. */
      const left=cx-est/2;
      let row=band.findIndex(r=>!r.length||left>=r.at(-1)+6);
      if(row<0) row=band.reduce((best,r,i)=>r.at(-1)<band[best].at(-1)?i:best,0);
      /* clamp to the frame: centre normally, but anchor to the edge rather than clip */
      let tx=cx, anc="middle";
      if(cx-est/2<JPAD){ tx=JPAD; anc="start"; }
      else if(cx+est/2>JW-JPAD){ tx=JW-JPAD; anc="end"; }
      band[row].push((anc==="start"?JPAD+est:anc==="end"?JW-JPAD:cx+est/2));
      const ly=y-16-row*17;
      g+=`<text x="${tx.toFixed(1)}" y="${ly}" text-anchor="${anc}" class="jlb">${esc(sg.l)}</text>
          <line x1="${cx.toFixed(1)}" y1="${ly+7}" x2="${cx.toFixed(1)}" y2="${y-4}" stroke="var(--axis)" stroke-width="1"/>`;
    }
    x+=sg.days*px;
  });
  return g;
}
function jaxis(y){
  const px=(JW-JPAD*2)/JSCALE(); let g="";
  for(let d=0;d<=JSCALE();d+=5){ const x=JPAD+d*px;
    g+=`<line x1="${x.toFixed(1)}" y1="${y}" x2="${x.toFixed(1)}" y2="${y+5}" stroke="var(--axis)"/>
        <text x="${x.toFixed(1)}" y="${y+18}" text-anchor="middle" class="tick">${d}</text>`; }
  g+=`<text x="${JPAD}" y="${y+36}" class="alabel">Days elapsed</text>`;
  return g;
}
const jlegend=()=>`<div class="legend">${Object.values(KIND).map(k=>
  `<span class="lg"><i style="background:${k.c}"></i>${k.t}</span>`).join("")}</div>`;

function journeyView(mode){
  if(mode==="cmp"){
    const a=CITY.journey.now,b=CITY.journey.next;
    const cut=JPAD+(b.total/JSCALE())*(JW-JPAD*2);
    return `<svg viewBox="0 0 ${JW} 340">
      <text x="${JPAD}" y="26" class="jrow">${a.label} &middot; ${a.total} days</text>
      ${journeyBar("now",40,68,false)}
      <text x="${JPAD}" y="162" class="jrow">${b.label} &middot; ${b.total} days</text>
      ${journeyBar("next",176,68,false)}
      <line x1="${cut}" y1="34" x2="${cut}" y2="256" stroke="var(--blue)" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="${cut+12}" y="272" class="jin" style="fill:var(--blue)">${a.total-b.total} days removed</text>
      <path d="M${cut+4},280 L${JW-JPAD},280" stroke="var(--blue)" stroke-width="1" stroke-dasharray="2 3"/>
      ${jaxis(300)}
    </svg>
    <div style="display:flex;gap:18px;align-items:center;margin-top:6px;flex-wrap:wrap">
      ${jlegend()}<span style="flex:1"></span>
      <span class="delta">${a.total-b.total} days removed &middot; ${Math.round((a.total-b.total)/a.total*100)}% faster</span>
      <span class="hint">Click any block</span></div>
    ${tableView(["View","Stage","Days","Type"],[...a.segs.map(s=>["Today",s.l,s.days,s.kind]),
      ...b.segs.map(s=>["After",s.l,s.days,s.kind])])}`;
  }
  const J=CITY.journey[mode], px=(JW-JPAD*2)/JSCALE();
  return `<svg viewBox="0 0 ${JW} 340">
    ${journeyBar(mode,126,72,true)}
    <text x="${JPAD}" y="216" class="jrow" style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;fill:var(--ink-3)">Of that, actual work on the file</text>
    <rect x="${JPAD}" y="226" width="${(JW-JPAD*2).toFixed(1)}" height="18" rx="4" fill="var(--grid)"/>
    <rect x="${JPAD}" y="226" width="${(J.work*px).toFixed(1)}" height="18" rx="4" fill="var(--s1)"/>
    <text x="${(JPAD+J.work*px+12).toFixed(1)}" y="239" class="jin" style="fill:var(--ink)">${J.work} days</text>
    ${jaxis(272)}
  </svg>
  <div style="display:flex;gap:18px;align-items:center;margin-top:4px;flex-wrap:wrap">
    ${jlegend()}<span style="flex:1"></span>
    <span class="delta">${J.total} days elapsed &middot; ${J.work} worked</span>
    <span class="hint">Click any block</span></div>
  ${tableView(["Stage","Days","Type","Owner"],J.segs.map(s=>[s.l,s.days,s.kind,s.who]))}`;
}

/* --- geography: districts light up in the year they were annexed ---------- */
function cityMap(year){
  const ds=CITY.districts, mx=Math.max(...ds.map(d=>d.parcels));
  let g="";
  ds.forEach((d,i)=>{
    const on=d.y<=year, si=Math.min(5,5-Math.floor((d.parcels/mx)*5.99)), step=SEQ[si];
    const lab=(on&&si<=2)?"#ffffff":on?"#08203a":"var(--ink-3)";   /* dark steps -> light ink */
    g+=`<polygon class="dist ${on?"":"future"} clk" data-dist="${i}" points="${d.pts}"
         fill="${on?`var(${step})`:"var(--surf-2)"}" fill-opacity="${on?.95:1}"/>`;
    g+=`<text class="mlabel" x="${d.lx}" y="${d.ly}" text-anchor="middle"
         opacity="${on?1:.55}" style="fill:${lab}">${esc(d.n)}</text>`;
    g+=`<text class="mlabel" x="${d.lx}" y="${d.ly+13}" text-anchor="middle" opacity="${on?.85:.45}"
         style="font-size:9.5px;fill:${lab}">${on?d.y:"planned "+d.y}</text>`;
  });
  return `<svg viewBox="0 0 540 400" style="max-height:440px">${g}</svg>`;
}

<script>
/* ===========================================================================
   ENGINE — drill-downs, the year spine, chart interaction, navigation.
   =========================================================================== */
const stage=$("#stage"), DRAWER=$("#drawer"), DBODY=$("#dbody"), SCRIM=$("#scrim");
let cur=0, yi=CITY.years.length-1, playing=null, els=[];

/* --- drill-down drawer ---------------------------------------------------- */
function openDrawer(html){ DBODY.innerHTML=html; DRAWER.classList.add("open"); SCRIM.classList.add("open"); }
function closeDrawer(){ DRAWER.classList.remove("open"); SCRIM.classList.remove("open"); $$(".node.sel,.jstep.sel").forEach(n=>n.classList.remove("sel")); }
const kv=(k,v)=>`<div class="kv"><span>${esc(k)}</span><b>${esc(v)}</b></div>`;

function drawerDept(key){
  if(key==="_exec"){ const d=CITY.depts;
    return `<div class="dk">Executive</div><h3>${esc(CITY.exec.n)}</h3><div class="sub">${esc(CITY.exec.r)}</div>
      ${kv("Total FTE",CITY.exec.fte)}${kv("Departments",d.length)}
      ${kv("Systems in scope",8)}
      ${kv("Assets in the listed register","~199,900")}
      <div class="sechd">The structural problem</div>
      <p style="font-size:14px;line-height:1.6;color:var(--ink-2)">Roughly 200,000 assets are spread across Utility Operations, Roads and Streets, Forestry and Engineering. They are held in AssetWorks, a set of ArcGIS Online layers, some in-house scripting and an unknown number of spreadsheets. Four owners, four places, and no single record. That is the finding, and it is the City’s own Addendum #1 Question 36 that says it: inventories are “stored in various locations.”</p>`; }
  const d=CITY.depts.find(x=>x.key===key); if(!d) return "";
  return `<div style="display:flex;gap:14px;align-items:flex-start;margin-bottom:6px">${icobox(d.icon||"building")}
    <div><div class="dk" style="color:var(${d.color})">Department</div>
      <h3>${esc(d.name)}</h3><div class="sub" style="margin-bottom:0">${esc(d.head)} &middot; ${esc(d.role)}</div></div></div>
    <div style="margin:14px 0 20px">${fig(d.photo,"16/9","Department photo","Optional · a crew, a counter, a screenshot · 720×405")}</div>
    ${d.fte?kv("Full-time equivalents",d.fte):kv("Full-time equivalents","not published \u2014 please tell us")}${kv("Divisions",d.divs.join(", "))}
    ${kv("Annual volume",d.volume)}
    <div class="sechd">Systems in use today</div>
    ${d.systems.map(s=>`<div class="kv"><span>${esc(s)}</span><b></b></div>`).join("")}
    <div class="sechd">What they said they need</div>
    ${d.needs.map(n=>`<div class="need p${n.p}"><span class="pr">Priority ${n.p}</span><div class="nt">${esc(n.t)}</div><div class="nd">${esc(n.d)}</div></div>`).join("")}
    <div class="sechd">In their words</div>
    <p class="qt">&ldquo;${esc(d.quote.q)}&rdquo;<cite>${esc(d.quote.w)}</cite></p>`;
}
function drawerCat(key){
  const c=CITY.bizCats.find(x=>x.key===key), i=CITY.bizCats.indexOf(c), y=CITY.years[yi];
  const g=pct(c.v[yi],c.v[0]), share=Math.round(c.v[yi]/CITY.bizCats.reduce((a,x)=>a+x.v[yi],0)*100);
  return `<div class="dk" style="color:var(${SER[i]})">Structure type</div>
    <h3>${esc(c.name)}</h3><div class="sub">${y} \u00b7 residential building permits</div>
    ${kv("Units permitted that year",c.v[yi].toLocaleString())}
    ${kv("Growth since "+CITY.years[0],(g>0?"+":"")+g+"%")}
    ${kv("Share of that year's units",share+"%")}
    ${kv("Added since "+CITY.years[0],(c.v[yi]-c.v[0]).toLocaleString())}
    <div class="sechd">Why it matters</div>
    <p style="font-size:14px;line-height:1.6;color:var(--ink-2)">${esc(c.note)}</p>
    <div class="sechd">Year by year</div>
    <table class="tv on" style="margin:0"><tbody>${CITY.years.map((yy,k)=>
      `<tr><td>${yy}</td><td>${c.v[k].toLocaleString()}</td></tr>`).join("")}</tbody></table>`;
}
function drawerDist(i){ const d=CITY.districts[i], y=CITY.years[yi];
  const on=d.y<=y, tot=CITY.districts.filter(x=>x.y<=y).reduce((a,x)=>a+x.parcels,0);
  return `<div class="dk">District</div><h3>${esc(d.n)}</h3>
    <div class="sub">${on?`Annexed ${d.y}`:`Planned for ${d.y}, not yet in the service area`}</div>
    ${kv("Parcels",d.parcels?d.parcels.toLocaleString():"none yet")}
    ${kv("Share of service area",on?Math.round(d.parcels/tot*100)+"%":"—")}
    ${kv("Years in the city",on?(y-d.y):"—")}
    <div class="sechd">Service implication</div>
    <p style="font-size:14px;line-height:1.6;color:var(--ink-2)">${
      d.y>2026 ? "Not yet annexed. The 2028 comprehensive plan puts roughly 1,400 parcels here, which would be a further 10% on the service area with no staffing assumption attached to it."
      : d.y>=2017 ? `Annexed inside the ten-year window. ${d.parcels.toLocaleString()} parcels were added to the same eleven permit staff with no corresponding position request. Public Works has no complete asset record for this district.`
      : "Established service area. Asset records exist but are split across the asset system, the GIS layers and departmental spreadsheets." }</p>`;
}
function drawerNeed(sig){ const [k,ci]=sig.split(":"), d=CITY.depts.find(x=>x.key===k);
  const v=CITY.needGrid[k][+ci], col=CITY.needCols[+ci];
  const lbl=["Not a need","Nice to have","Real but not urgent","Pressing","Acute"][v];
  const rel=d.needs.find(n=>n.t.toLowerCase().includes(col.toLowerCase().split(" ")[0]))||d.needs[0];
  return `<div class="dk">Need</div><h3>${esc(col)}</h3><div class="sub">${esc(d.name)}</div>
    ${kv("Intensity",v+" of 4 · "+lbl)}${kv("Department head",d.head)}${kv("FTE affected",d.fte)}
    <div class="sechd">What they told us</div>
    <div class="need p${rel.p}"><span class="pr">Priority ${rel.p}</span><div class="nt">${esc(rel.t)}</div><div class="nd">${esc(rel.d)}</div></div>
    <div class="sechd">Across the organisation</div>
    <p style="font-size:14px;line-height:1.6;color:var(--ink-2)">${esc(col)} scores ${CITY.depts.filter(x=>CITY.needGrid[x.key][+ci]>=3).length} acute or pressing out of ${CITY.depts.length} departments: ${
      CITY.depts.filter(x=>CITY.needGrid[x.key][+ci]>=3).map(x=>x.name).join(", ")||"none"}.</p>
    <p class="xs">Scored by us from your RFP, its addenda and your Asset Management demonstration questions, not from interviews we did not have. Every cell is an inference. If this one is wrong, say so and we will change it on the spot.</p>`;
}
function drawerStep(sig){
  const [w,i]=sig.split(":"), J=CITY.journey[w], sg=J.segs[+i];
  const before=J.segs.slice(0,+i).reduce((a,x)=>a+x.days,0);
  const kind={work:"City working",wait:"City waiting",applicant:"With the applicant"}[sg.kind];
  return `<div class="dk">${w==="now"?"Current process":"Future process"}</div>
    <h3>${esc(sg.l)}</h3><div class="sub">Day ${before} to day ${before+sg.days} of ${J.total}</div>
    ${kv("Elapsed",sg.days===0?"same day":sg.days+" days")}
    ${kv("Of which actual work",sg.touch?sg.touch+" days":"none")}
    ${kv("Type",kind)}${kv("Owner",sg.who)}
    ${kv("Share of total time",Math.round(sg.days/J.total*100)+"%")}
    <div class="sechd">What happens here</div>
    <p style="font-size:14px;line-height:1.6;color:var(--ink-2)">${esc(sg.det)}</p>
    ${sg.kind==="wait"&&sg.days-sg.touch>=2?`<div class="need p1">
      <div class="nt">${(sg.days-sg.touch).toFixed(sg.touch%1?1:0)} days with nobody on it</div>
      <div class="nd">Not work time. Wait time. This is the part that a clock and automatic routing remove, without anyone working faster.</div></div>`:""}
    ${sg.kind==="applicant"?`<div class="need" style="border-left-color:var(--axis)">
      <div class="nt">This one is not yours</div>
      <div class="nd">The city is not the bottleneck here. The format is: a portal response is faster than a re-submittal, but the applicant still owns the clock.</div></div>`:""}`;
}
function drawerCost(){ const rows=[["Status calls per week","40","Front-counter log, week of Aug 3 2026"],
  ["Minutes per call","11","Observed average, same sample"],["Loaded hourly rate","$52","2026 CO municipal admin rate table"],
  ["First-pass rejection","31%","TrakIt export, FY26 residential"],["Fee recognition lag","38 days","TrakIt export, FY26"],
  ["Permits per year","3,840","TrakIt export, FY26"]];
  return `<div class="dk">Assumptions</div><h3>How the $412,000 is built</h3>
    <div class="sub">Every input, with where it came from</div>
    ${rows.map(r=>`<div class="kv"><span>${esc(r[0])}<span class="xs" style="display:block">${esc(r[2])}</span></span><b>${esc(r[1])}</b></div>`).join("")}
    <div class="sechd">Take it apart</div>
    <p style="font-size:14px;line-height:1.6;color:var(--ink-2)">A number you will not show the inputs for is a number nobody believes. If any row here is wrong, the total is wrong, and we would rather find that out today than in a procurement protest.</p>`;
}

/* --- the year spine ------------------------------------------------------- */
function setYear(i,el){
  yi=Math.max(0,Math.min(CITY.years.length-1,i));
  const y=CITY.years[yi], sc=el||els[cur]?.el; if(!sc) return;
  const lab=$("#yrLab",sc); if(lab) lab.textContent=y;
  const rail=$("#rail",sc);
  if(rail){ $(".fg",rail).style.width=(yi/(CITY.years.length-1)*100)+"%";
    $$(".st",rail).forEach((s,k)=>{ s.classList.toggle("past",k<yi); s.classList.toggle("now",k===yi); }); }
  const fn=SYNC[SCENES[cur].t]; if(fn) fn(sc,yi);
}
const SYNC={
  decade(sc,i){
    const G=GROWTH();
    G.forEach(r=>{
      const p=pct(r.v[i],r.v[0]);
      const bar=sc.querySelector(`[data-race="${r.k}"] .rb`);
      if(bar) bar.style.width=Math.max(0,p)/RACEMAX*100+"%";
      const v=sc.querySelector(`[data-racev="${r.k}"]`); if(v) v.textContent=fmtV(r.v[i],r.fmt);
      const d=sc.querySelector(`[data-racep="${r.k}"]`);
      if(d) d.textContent = i===0 ? "baseline" : (p>=0?"+":"")+p+"%";
    });
    /* the punchline only exists once there is enough decade to see it */
    const f=sc.querySelector("#raceflag");
    if(f){
      const sp=pct(G[4].v[i],G[4].v[0]), bp=pct(G[0].v[i],G[0].v[0]);
      f.style.visibility="visible";
      if(i===0){ f.className="raceflag base"; f.textContent=`${CITY.years[0]} is the baseline. Drag right, or press play.`; }
      else if(i>=6){ f.className="raceflag";
        f.textContent=`The general fund grew ${bp}%. The people who do the work grew ${sp}%.`; }
      else { f.className="raceflag base"; f.textContent=`${CITY.years[i]} \u00b7 keep going.`; }
    }
  },
  biz(sc,i){ $$("[data-yr]",sc).forEach(n=>n.textContent=CITY.years[i]);
    CITY.bizCats.forEach(c=>{ const v=$(`[data-bizv="${c.key}"]`,sc); if(v) v.textContent=c.v[i].toLocaleString();
      /* share of that year's units, not growth since 2015. On categories that start
         at 2 units, a growth figure reads as +1200% and tells the room nothing. */
      const d=$(`[data-bizd="${c.key}"]`,sc); if(d){
        const tot=CITY.bizCats.reduce((a,x)=>a+x.v[i],0);
        d.textContent = tot? Math.round(c.v[i]/tot*100)+"%" : "";
        d.style.color="var(--ink-3)"; } });
    const xh=$(".xstack .xh",sc); if(xh){ const p=JSON.parse($(".xstack",sc).dataset.p);
      const x=p.P.l+(i/(p.n-1))*(p.W-p.P.l-p.P.r); xh.setAttribute("x1",x); xh.setAttribute("x2",x); xh.setAttribute("opacity",".45"); } },
  geo(sc,i){ const y=CITY.years[i], w=$("#mapwrap",sc); if(w) w.innerHTML=cityMap(y);
    const on=CITY.districts.filter(d=>d.y<=y);
    const dn=$('[data-geo="d"]',sc), pn=$('[data-geo="p"]',sc);
    if(dn) dn.textContent=on.length;
    if(pn) pn.textContent=on.reduce((a,d)=>a+d.parcels,0).toLocaleString(); }
};
function play(){ if(playing){ clearInterval(playing); playing=null; return; }
  if(yi>=CITY.years.length-1) setYear(0);
  playing=setInterval(()=>{ if(yi>=CITY.years.length-1){ clearInterval(playing); playing=null; return; } setYear(yi+1); },460);
}
</script>

/* ===== demo flow: links, ticks and outcomes ============================== */
const _LSK="bis-demo-links-v1", _LSD="bis-demo-done-v1";
const _ls=(k,d)=>{ try{ return JSON.parse(localStorage.getItem(k)||"")||d; }catch(e){ return d; } };
let LS_LINKS=_ls(_LSK,{}), DONE=_ls(_LSD,{});
const saveLS=()=>{ try{ localStorage.setItem(_LSK,JSON.stringify(LS_LINKS)); localStorage.setItem(_LSD,JSON.stringify(DONE)); }catch(e){} };
const linkFor=q=>String((q in LS_LINKS)?LS_LINKS[q]:(DEMO_LINKS[q]||"")).trim();

function refreshDemo(){
  $$("#stage .chreq").forEach(box=>{
    const rows=$$(".r",box); let nextSet=false;
    rows.forEach(r=>{ const q=r.dataset.req, done=!!DONE[q], url=linkFor(q);
      r.classList.toggle("done",done);
      r.classList.remove("next");
      if(!done && !nextSet){ r.classList.add("next"); nextSet=true; }
      const g=$(".go",r);
      if(g){ g.className="go "+(url?"live":"none"); g.textContent=url?(done?"Open again ↗":"Open live demo ↗"):(done?"Shown":"Mark shown"); }
    });
    const nc=box.parentElement.querySelector(".nextch");
    if(nc) nc.classList.toggle("on", rows.length>0 && rows.every(r=>DONE[r.dataset.req]));
  });
  $$("#stage [data-chprog]").forEach(el=>{ const c=CITY.chapters[+el.dataset.chprog];
    const d=c.reqs.filter(r=>DONE[r[0]]).length;
    el.textContent = d ? (d===c.reqs.length?"All "+d+" shown":d+" of "+c.reqs.length+" shown") : ""; });
  const n=Object.keys(DEMO_LINKS).filter(q=>linkFor(q)).length, cnt=$("#lkcount");
  if(cnt) cnt.textContent=n+" of 20 links set";
  $$("#stage .lk .row").forEach(r=>{ const st=$(".st",r); if(st) st.classList.toggle("on",!!linkFor(r.dataset.q)); });
}

/* ===== lifecycle diagram ================================================= */
const LIFE={W:1200,H:500,cx:600,cy:255,rx:330,ry:160,r:30};
function lifeView(mode){
  const L=CITY.life, n=L.stages.length, P=LIFE;
  const pt=i=>{ const a=(-90+i*360/n)*Math.PI/180; return {a,x:P.cx+P.rx*Math.cos(a),y:P.cy+P.ry*Math.sin(a)}; };
  let g=`<defs><marker id="larrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="var(--s1)"/></marker></defs>`;
  g+=`<ellipse cx="${P.cx}" cy="${P.cy}" rx="${P.rx}" ry="${P.ry}" fill="none" stroke="var(--grid)" stroke-width="2"/>`;
  g+=`<ellipse class="ldraw" pathLength="100" cx="${P.cx}" cy="${P.cy}" rx="${P.rx}" ry="${P.ry}" fill="none" stroke="var(--s1)" stroke-width="2.5"/>`;
  for(let i=0;i<n;i++){ const p=pt(i); const ux=(P.cx-p.x), uy=(P.cy-p.y), d=Math.hypot(ux,uy);
    g+=`<line x1="${(P.cx-ux/d*76).toFixed(1)}" y1="${(P.cy-uy/d*76).toFixed(1)}" x2="${(p.x+ux/d*(P.r+4)).toFixed(1)}" y2="${(p.y+uy/d*(P.r+4)).toFixed(1)}" stroke="var(--axis)" stroke-width="1" stroke-dasharray="3 4"/>`; }
  for(let i=0;i<n;i++){ const t=(-90+(i+0.5)*360/n)*Math.PI/180;
    const x=P.cx+P.rx*Math.cos(t), y=P.cy+P.ry*Math.sin(t);
    const deg=Math.atan2(P.ry*Math.cos(t),-P.rx*Math.sin(t))*180/Math.PI;
    g+=`<path class="larr" style="animation-delay:${(0.5+i*0.08).toFixed(2)}s" d="M-6,-5 L6,0 L-6,5 Z" fill="var(--s1)" transform="translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${deg.toFixed(1)})"/>`; }
  g+=`<circle cx="${P.cx}" cy="${P.cy}" r="74" fill="var(--navy)"/>
    <text x="${P.cx}" y="${P.cy-10}" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#fff">${esc(L.hub[0])}</text>
    <text x="${P.cx}" y="${P.cy+12}" text-anchor="middle" style="font-size:17px;font-weight:600;fill:#fff">${esc(L.hub[1])}</text>
    <text x="${P.cx}" y="${P.cy+34}" text-anchor="middle" style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;fill:var(--teal)">${esc(L.hubSub)}</text>`;
  if(mode==="life"){
    const b1=pt(1), b3=pt(3);
    g+=`<g class="lin" style="animation-delay:1.1s"><rect x="940" y="34" width="246" height="36" rx="18" fill="var(--surf-2)" stroke="var(--axis)"/>
      <text x="1063" y="57" text-anchor="middle" style="font-size:13.5px;font-weight:600;fill:var(--ink)">From your permitting system</text>
      <path d="M990,70 Q${(b1.x+10).toFixed(0)},72 ${(b1.x+4).toFixed(0)},${(b1.y-P.r-6).toFixed(0)}" fill="none" stroke="var(--s1)" stroke-width="1.5" marker-end="url(#larrow)"/></g>`;
    g+=`<g class="lin" style="animation-delay:1.2s"><rect x="958" y="392" width="200" height="36" rx="18" fill="var(--surf-2)" stroke="var(--axis)"/>
      <text x="1058" y="415" text-anchor="middle" style="font-size:13.5px;font-weight:600;fill:var(--ink)">Resident requests</text>
      <path d="M958,410 L${(b3.x+P.r+8).toFixed(0)},${(b3.y+2).toFixed(0)}" fill="none" stroke="var(--s1)" stroke-width="1.5" marker-end="url(#larrow)"/></g>`;
    g+=`<text class="lin" style="animation-delay:1.3s;font-size:12.5px;fill:var(--ink-3);font-style:italic" x="452" y="84" text-anchor="end">renew, repair or retire</text>`;
  }
  L.stages.forEach((st,i)=>{ const p=pt(i), sx=Math.cos(p.a), sy=Math.sin(p.a);
    const subs = mode==="ai" ? [["can","Can: "+st.can],["cant","Can't: "+st.cant]]
               : mode==="who" ? [["",st.who]] : [["",st.life]];
    const lines=[["nm",st.t],...subs.map(x=>["sb "+x[0],x[1]])], lh=19;
    let x=p.x, y, anc="middle";
    if(sy<-0.85){ y=p.y-P.r-14-(lines.length-1)*lh; }
    else if(sy>0.85){ y=p.y+P.r+24; }
    else { anc=sx>0?"start":"end"; x=p.x+(sx>0?1:-1)*(P.r+14); y=p.y-((lines.length-1)*lh)/2+5; }
    g+=`<g class="lnode clk" data-stage="${i}" style="animation-delay:${(0.35+i*0.09).toFixed(2)}s">
      <circle class="nd" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${P.r}"/>
      <text class="num" x="${p.x.toFixed(1)}" y="${(p.y+5).toFixed(1)}" text-anchor="middle">${String(i+1).padStart(2,"0")}</text>
      ${lines.map((l,k)=>`<text class="${l[0]}" x="${x.toFixed(1)}" y="${(y+k*lh).toFixed(1)}" text-anchor="${anc}">${esc(l[1])}</text>`).join("")}
    </g>`; });
  const strip=CITY.life.strips[mode]||[];
  return `<svg viewBox="0 0 ${P.W} ${P.H}" role="img" aria-label="Asset lifecycle">${g}</svg>
    <div class="lstrip ${mode==="ai"?"ai":""}">${strip.map(x=>`<span>${esc(x)}</span>`).join("")}</div>`;
}

    ${kv("Who",st.who)}${kv("Where",st.where)}

stage.addEventListener("click",e=>{
  const lv=e.target.closest("[data-lview]");
  if(lv){ const sc=els[cur].el; SCENES[cur].lview=lv.dataset.lview;
    $$(".segb",sc).forEach(b=>b.classList.toggle("on",b===lv));
    $(".lwrap",sc).innerHTML=lifeView(lv.dataset.lview); makeFocusable(sc); return; }
  const stg=e.target.closest("[data-stage]"); if(stg) return openDrawer(drawerStage(+stg.dataset.stage));
  const rq=e.target.closest(".chreq .r[data-req]");
  if(rq){ const q=rq.dataset.req, url=linkFor(q);
    if(url){ window.open(url,"_blank","noopener"); DONE[q]=true; }
    else { DONE[q]=!DONE[q]; }
    saveLS(); refreshDemo(); return; }
  const nx=e.target.closest("[data-nextch]"); if(nx) return go(cur+1);
  const act=e.target.closest("[data-lkact]");
  if(act){ const a=act.dataset.lkact;
    if(a==="reset"){ DONE={}; saveLS(); refreshDemo(); }
    if(a==="clear"){ LS_LINKS={}; saveLS(); $$("#stage input[data-link]").forEach(inp=>inp.value=linkFor(inp.dataset.link)); refreshDemo(); }
    if(a==="save"){ downloadWithLinks(); }
    return; }
});
stage.addEventListener("input",e=>{ const inp=e.target.closest("input[data-link]"); if(!inp) return;
  LS_LINKS[inp.dataset.link]=inp.value.trim(); saveLS(); refreshDemo(); });
/* typing a URL must not drive the deck */
stage.addEventListener("keydown",e=>{ if(e.target.matches("input,textarea")) e.stopPropagation(); });

function downloadWithLinks(){
  if(typeof __PRISTINE!=="string"){ alert("Could not read the deck source."); return; }
  const merged={}; Object.keys(DEMO_LINKS).forEach(q=>merged[q]=linkFor(q));
  /* markers assembled at runtime so they appear exactly once in the file: the data block */
  const S="/*DEMO-LINKS-"+"START*/", E="/*DEMO-LINKS-"+"END*/";
  const i0=__PRISTINE.indexOf(S), i1=__PRISTINE.indexOf(E, i0);
  if(i0<0||i1<0){ alert("Could not find the link block in the deck."); return; }
  const out=__PRISTINE.slice(0,i0)+S+"\nconst DEMO_LINKS = "+JSON.stringify(merged,null,2)+";\n"+__PRISTINE.slice(i1);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([out],{type:"text/html"}));
  a.download="Bismarck-Presentation.html"; document.body.appendChild(a); a.click(); a.remove();
}

function capChartSVG(){
  const C=CITY.capChart, S=C.series, W=1180,H=300,P={l:10,r:10,t:34,b:36};
  const mx=Math.max(...S.map(x=>x.v))*1.08, bw=(W-P.l-P.r)/S.length;
  let g="";
  S.forEach((x,i)=>{ const h=(x.v/mx)*(H-P.t-P.b), X=P.l+i*bw+bw*0.2, Y=H-P.b-h, hi=x.y===C.hl;
    g+=`<rect class="bar" style="animation-delay:${(0.15+i*0.09).toFixed(2)}s" x="${X.toFixed(1)}" y="${Y.toFixed(1)}" width="${(bw*0.6).toFixed(1)}" height="${h.toFixed(1)}" rx="8" fill="${hi?"var(--s1)":x.plan?"rgba(0,104,190,.07)":"rgba(0,104,190,.30)"}" ${x.plan?'stroke="rgba(0,104,190,.45)" stroke-width="1.5" stroke-dasharray="5 4"':""}/>

      <text x="${(X+bw*0.3).toFixed(1)}" y="${H-10}" text-anchor="middle" style="font-size:15px;font-weight:${hi?700:500};fill:${hi?"var(--ink)":"var(--ink-3)"}">${x.y}</text>`; });
  const pi=S.findIndex(x=>x.plan);
  if(pi>0){ const X=P.l+pi*bw; g+=`<line x1="${X.toFixed(1)}" y1="${P.t-4}" x2="${X.toFixed(1)}" y2="${H-P.b}" stroke="var(--axis)" stroke-dasharray="3 4"/>

`;
}

function countUp(el){
  if(el.dataset.done) return; const orig=el.textContent;
  const m=orig.match(/^([^0-9]*)([0-9][0-9,]*(?:\.[0-9]+)?)(.*)$/); if(!m) return;
  el.dataset.done="1";
  if(document.body.classList.contains("nomotion")||matchMedia("(prefers-reduced-motion: reduce)").matches){ el.textContent=orig; return; }
  const pre=m[1], num=parseFloat(m[2].replace(/,/g,"")), suf=m[3], dec=(m[2].split(".")[1]||"").length, com=m[2].indexOf(",")>=0;
  const t0=performance.now(), D=900;
  const fmt=v=>{ let x=v.toFixed(dec); if(com){ const pr=x.split("."); x=pr[0].replace(/\B(?=(\d{3})+(?!\d))/g,",")+(pr[1]?"."+pr[1]:""); } return pre+x+suf; };
  const step=t=>{ const k=Math.min(1,(t-t0)/D), e=1-Math.pow(1-k,3); el.textContent=fmt(num*e); if(k<1) requestAnimationFrame(step); else el.textContent=orig; };
  requestAnimationFrame(step);
}
function onEnterScene(){ const sc=els[cur]&&els[cur].el; if(!sc) return;
  sc.querySelectorAll("[data-count]").forEach(countUp);
  if(SCENES[cur].t==="waffle") runWaffle(sc);
}

      t.textContent=tb.classList.contains("on")?"Hide table":"Table"; } return; }

/* --- navigation ----------------------------------------------------------- */
function go(i){
  try{ refreshDemo(); }catch(_e){}
  if(playing){ clearInterval(playing); playing=null; }
  closeDrawer(); untip();
  cur=Math.max(0,Math.min(els.length-1,i));
  els.forEach(x=>x.el.classList.toggle("on",x.i===cur));
  const sc=els[cur].el, s=SCENES[cur];
  $("#bar").style.width=((cur+1)/els.length*100)+"%";
  $("#cnt").innerHTML=`<b>${cur+1}</b> / ${els.length}`;
  $$("#gr .th").forEach(t=>t.classList.toggle("cur",+t.dataset.i===cur));
  const _src=__SRC[cur];
  $("#nb").innerHTML=((s.notes||[]).length?`<ul>${s.notes.map(n=>`<li style="margin-bottom:9px">${esc(n)}</li>`).join("")}</ul>`:"<em>No notes.</em>")
    +(_src?`<div style="margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14)">
      <b style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#8FB4CC">Source</b>
      <div style="margin-top:6px;color:#9FBACD">${esc(_src)}</div></div>`:"");
  if(s.year){ setYear(yi,sc); const rail=$("#rail",sc), pb=$("#play",sc);
    if(rail&&!rail.dataset.w){ rail.dataset.w="1";
      const pick=e=>{ const r=rail.getBoundingClientRect();
        setYear(Math.round((e.clientX-r.left)/r.width*(CITY.years.length-1)),sc); };
      rail.addEventListener("pointerdown",e=>{ pick(e); rail.setPointerCapture(e.pointerId);
        rail.onpointermove=ev=>pick(ev); });
      rail.addEventListener("pointerup",()=>rail.onpointermove=null); }
    if(pb&&!pb.dataset.w){ pb.dataset.w="1"; pb.onclick=play; } }
  if(s.t==="geo") wireMapHover(sc);
  makeFocusable(sc);
  if(s.t==="needs") wireCells(sc);
  history.replaceState(null,"","#"+(cur+1));
}

addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  switch(e.key){
    case "ArrowRight": case "PageDown": e.preventDefault(); go(cur+1); break;
    case "ArrowLeft":  case "PageUp":   e.preventDefault(); go(cur-1); break;
    case "Home": go(0); break; case "End": go(els.length-1); break;
    case ",": if(SCENES[cur].year) setYear(yi-1); break;
    case ".": if(SCENES[cur].year) setYear(yi+1); break;
    case "p": case "P": if(SCENES[cur].year) play(); break;
    case "o": case "O": toggle("#ovlG"); break;
    case "n": case "N": toggle("#ovlN"); break;
    case "h": case "H": $("#chrome").classList.toggle("hide"); break;
    case "?": toggle("#ovlH"); break;
    case "t": case "T": $$(".tv").forEach(x=>x.classList.toggle("on")); break;
    case "f": case "F": document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); break;

body.nomotion .bar7{clip-path:none;animation:none}
@keyframes bar7{to{clip-path:inset(0 0 0 0)}}
.bar7 .sg{flex-basis:0;min-width:0;background:#0068BE;display:flex;flex-direction:column;justify-content:flex-end;
  padding:14px 12px;overflow:hidden}
.bar7 .sg:nth-child(even){background:#1B7ACB}
.bar7 .sg.sm{background:rgba(255,255,255,.22)}
.bar7 .sg.fl{background:var(--s2);min-width:7px}
.bar7 .n{font-size:14px;color:rgba(255,255,255,.80);line-height:1.2}
.bar7 b{font-size:21px;font-weight:600;color:#fff;margin-top:4px;letter-spacing:-.01em}
.flcall{position:absolute;right:0;bottom:calc(100% + 16px);opacity:0;text-align:right;white-space:nowrap}
.flcall::after{content:"";position:absolute;right:2px;top:100%;margin-top:4px;width:2px;height:12px;background:var(--s2)}
.sc.on .flcall{animation:v7in .5s ease 1.9s forwards}
body.nomotion .flcall{opacity:1;animation:none}
.flcall span{font-size:21px;color:var(--s2);font-weight:600}
.sc.nav .flcall b{color:var(--s2);font-weight:700}
.wsrow{display:grid;grid-template-columns:auto 1fr;gap:72px;align-items:center;margin-top:70px}
.wsrow .v{font-size:124px;font-weight:200;letter-spacing:-.05em;color:var(--s2);line-height:.9;display:block}
.wsrow .l{font-size:22px;color:#B9CBD6;display:block;margin-top:12px}
.wsrow .say{font-size:40px;font-weight:300;line-height:1.22;color:#fff;letter-spacing:-.02em;max-width:24ch}
@keyframes v7in{to{opacity:1}}
</style>
<style id="v7cap">
.cap7{display:grid;grid-template-columns:1.5fr 1fr;gap:80px;align-items:center;margin-top:8px}
.c7h{font-size:17px;color:var(--ink-2);margin-bottom:18px}
.c7r{display:grid;grid-template-columns:170px 1fr 92px;gap:16px;align-items:center;height:44px}
.c7r .nm{font-size:17px;color:var(--ink)}
.c7r .tr{height:26px;display:block}
.c7r .tr i{display:block;height:100%;border-radius:0 6px 6px 0;background:#9CC3E6;transform-origin:left;transform:scaleX(0)}
.sc.on .c7r .tr i{animation:c7g .9s var(--ease) both}
body.nomotion .c7r .tr i{transform:none;animation:none}
@keyframes c7g{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.c7r.a .tr i{background:var(--s1)} .c7r.a .nm,.c7r.a .vl{font-weight:700;color:var(--s1)}
.c7r.o .tr i{background:#D5DCE3} .c7r.o .nm{color:var(--ink-2)}
.c7r .vl{font-size:17px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.c7s{display:flex;flex-direction:column;gap:34px}
.c7s .v{font-size:76px;font-weight:200;letter-spacing:-.045em;line-height:.95;color:var(--s1)}
.c7s .warn .v{color:var(--s2)}
.c7s .l{font-size:19px;color:var(--ink-2);margin-top:8px}
.c7say{margin-top:44px;padding-top:26px;border-top:1px solid var(--hair);font-size:30px;font-weight:300;letter-spacing:-.015em;color:var(--ink)}
.cap7{grid-template-columns:1.75fr 1fr;gap:72px}
.c7r{grid-template-columns:180px 1fr 100px;height:50px}
.c7r .nm,.c7r .vl{font-size:18px}
.c7r .tr{height:30px}
.sc .mandg .mcard{padding:30px 26px}
.sc .mandg .mcard .t{font-size:22px}
.sc .mandg .mcard .d{font-size:17px}
.sc .mandg .mcard .w{font-size:14px}
</style>
<style id="v8patty">
/* V8 (Patty pass): What we heard fills the space the removed row left; the loop gets bigger */
.sc.t-priorities .prt{margin-top:52px}
.sc.t-priorities .prr{padding:28px 0}
.sc.t-priorities .prr.hd{padding:0 0 12px;font-size:17px}
.sc.t-priorities .prr .pic svg{width:34px;height:34px}
.sc.t-priorities .prr .ask{font-size:26px}
.sc.t-priorities .prr .why{font-size:19.5px}
.sc.t-priorities .prr .out{font-size:19.5px}
.sc.t-lifecycle .lwrap svg{height:600px}
</style>
<!-- QA-OVERLAY-START · live Q&A overlay (served by ~/Bismarck-QA-Portal). Press Q for the QR card. -->
<script>
/* Where the Q&A server lives. Set once with ?qa=https://your-host in the deck URL;
   it is remembered in this browser. ?qa=off turns the overlay off. */
(function(){
  try{
    const u=new URLSearchParams(location.search).get("qa");
    if(u) localStorage.setItem("bis-qa-base",u);
    const base=(localStorage.getItem("bis-qa-base")||"http://localhost:8787").replace(/\/$/,"");
    if(base==="off") return;
    window.QA_BASE=base;
    const s=document.createElement("script"); s.src=base+"/s/qa-overlay.js"; s.async=true; s.onerror=()=>{};
    document.head.appendChild(s);
  }catch(e){}
})();
</script>
<!-- QA-OVERLAY-END -->
</body>
</html>
